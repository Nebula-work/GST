# AWS Amplify Hosting build spec.
#
# This repo is a monorepo: the Next.js app lives in `frontend/` and the Python
# backend in `backend/`. Amplify hosts ONLY the frontend — deploy the FastAPI
# backend separately (App Runner / EC2 / etc.) and point the frontend at it.
#
# REQUIRED: in the Amplify console (Hosting > Environment variables) set
#   NEXT_PUBLIC_API_BASE = https://<your-backend-host>
# It is baked into the build (NEXT_PUBLIC_ prefix), so it must be set before
# the build runs. Without it the site falls back to http://localhost:8011.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>GST Purchase Matcher</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #fdfbf4; color: #1f2a26;
      font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .box { text-align: center; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 14px;
      background: #0c6b4f; color: #fdfbf4; display: grid; place-items: center;
      font: 600 28px Georgia, serif;
    }
    h1 { font: 600 20px Georgia, serif; margin: 0 0 6px; }
    p { margin: 0; opacity: .7; }
    .spin {
      width: 18px; height: 18px; margin: 22px auto 0; border-radius: 50%;
      border: 2px solid rgba(12,107,79,.25); border-top-color: #0c6b4f;
      animation: r .8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">₹</div>
    <h1>GST Purchase Matcher</h1>
    <p>Starting the reconciliation engine…</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>

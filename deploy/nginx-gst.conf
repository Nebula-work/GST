# GST Purchase Matcher — single-origin nginx site.
# Serves the static frontend and reverse-proxies /api/ to the FastAPI backend,
# so the browser only ever talks to one origin (no CORS needed).
#
# Install:
#   # rate-limit zones live in http{} context -> install the conf.d snippet too:
#   sudo cp deploy/nginx-gst-ratelimit.conf /etc/nginx/conf.d/gst-ratelimit.conf
#   sudo cp deploy/nginx-gst.conf /etc/nginx/sites-available/gst.sysmos.org
#   sudo ln -sf /etc/nginx/sites-available/gst.sysmos.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot to add HTTPS:  sudo certbot --nginx -d gst.sysmos.org

server {
    listen 80;
    listen [::]:80;
    server_name gst.sysmos.org;            # <-- your subdomain

    # Static frontend: Next.js `output: "export"` produces this folder.
    root /var/www/gst;
    index index.html;

    # Two .xlsx files at 15 MB each + multipart overhead. Kept just above the
    # backend's per-file cap so oversized bodies are 413'd here, not buffered by
    # the app (the old 40M let bodies far larger than the backend accepts reach
    # uvicorn before rejection).
    client_max_body_size 32M;

    # Drop trickle / slow-body uploads instead of holding worker connections.
    client_body_timeout 15s;
    send_timeout 30s;

    # API -> FastAPI (uvicorn on localhost). NOTE: no trailing slash on
    # proxy_pass, so the "/api" prefix is preserved.
    location /api/ {
        # Per-client rate + connection limits (zones in nginx-gst-ratelimit.conf).
        limit_req  zone=gstapi burst=10 nodelay;
        limit_conn gstconn 4;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # The expensive reconcile endpoint gets a stricter rate and fewer parallel
    # connections — a single crafted upload is costly even after the app caps.
    location = /api/reconcile {
        limit_req  zone=gstrecon burst=3 nodelay;
        limit_conn gstconn 2;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Immutable hashed build assets — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static-export routing: exact file, then <path>.html, then a real 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}

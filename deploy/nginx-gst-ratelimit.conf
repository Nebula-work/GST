# Rate-limit / connection-limit zones for the GST Purchase Matcher API.
#
# limit_req_zone / limit_conn_zone MUST live in nginx's `http {}` context, so
# this snippet goes in conf.d (which nginx includes at http scope):
#
#   sudo cp deploy/nginx-gst-ratelimit.conf /etc/nginx/conf.d/gst-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The matching `limit_req` / `limit_conn` directives are applied per-location in
# nginx-gst.conf. Keyed on the real client IP ($binary_remote_addr); 10m holds
# ~160k unique IPs. Tune the rates to your real traffic — this is a manual
# upload tool, so a human submits at most a few reconciles per minute.

# General API traffic (health, samples): forgiving.
limit_req_zone  $binary_remote_addr  zone=gstapi:10m   rate=30r/m;
# The expensive reconcile endpoint: stricter.
limit_req_zone  $binary_remote_addr  zone=gstrecon:10m rate=10r/m;
# Cap simultaneous connections per client.
limit_conn_zone $binary_remote_addr  zone=gstconn:10m;
